name: Mutation

# Non-blocking for now (issue #8): no --break-at, the report is for reading.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch:

env:
  DOTNET_VERSION: "11.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker.NET
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 10.0 runs the tool and the net10.0 tests Stryker is pinned to; the SDK builds the other targets.
          dotnet-version: |
            10.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Stryker
        working-directory: test/Myelin.Tests
        run: dotnet stryker --output ${{ github.workspace }}/stryker

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: stryker/reports/
          if-no-files-found: warn
